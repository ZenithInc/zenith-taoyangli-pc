{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "pc.fullname" . }}-strip-public-prefix
  labels:
    {{- include "pc.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
      - {{ .Values.ingress.publicPrefix | quote }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pc.fullname" . }}
  labels:
    {{- include "pc.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s-strip-public-prefix@kubernetescrd" .Release.Namespace (include "pc.fullname" .) | quote }}
    taoyangli.cn/exposure: internal-host-only
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "pc.fullname" . }}
                port: {name: http}
{{- end }}
