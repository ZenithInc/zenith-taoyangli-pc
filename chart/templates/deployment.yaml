apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pc.fullname" . }}
  labels:
    {{- include "pc.labels" . | nindent 4 }}
    app.kubernetes.io/component: http
spec:
  replicas: {{ .Values.http.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      {{- include "pc.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: http
  template:
    metadata:
      labels:
        {{- include "pc.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: http
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.http.terminationGracePeriodSeconds }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: pc-http
          image: {{ include "pc.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          envFrom:
            - secretRef: {name: {{ include "pc.runtimeSecret" . }}}
          env:
            - {name: APP_ROLE, value: http}
          ports:
            - {name: http, containerPort: 9501, protocol: TCP}
          startupProbe:
            httpGet:
              path: /readyz
              port: http
              httpHeaders:
                - {name: X-Taoyangli-Internal-Probe, value: "1"}
            {{- toYaml .Values.probes.startup | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              httpHeaders:
                - {name: X-Taoyangli-Internal-Probe, value: "1"}
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - {name: X-Taoyangli-Internal-Probe, value: "1"}
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml .Values.http.resources | nindent 12 }}
          volumeMounts:
            - {name: runtime, mountPath: /data/project/runtime}
            - {name: logs, mountPath: /data/project/logs}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: runtime
          emptyDir: {sizeLimit: 256Mi}
        - name: logs
          emptyDir: {sizeLimit: 128Mi}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
