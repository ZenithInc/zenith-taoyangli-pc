apiVersion: v1
kind: Service
metadata:
  name: {{ include "pc.fullname" . }}
  labels:
    {{- include "pc.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "pc.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: http
  ports:
    - {name: http, port: {{ .Values.service.httpPort }}, targetPort: http, protocol: TCP}
